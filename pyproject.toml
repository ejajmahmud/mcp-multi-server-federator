[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-multi-server-federator"
version = "0.1.0"
description = "Unified MCP gateway federating multiple heterogeneous Model Context Protocol servers into a single namespace"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
mcp-multi-server-federator = "mcp_multi_server_federator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_multi_server_federator*"]
